<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3eee4"/>
      <stop offset="1" stop-color="#e2d9c7"/>
    </linearGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb15a"/>
      <stop offset="1" stop-color="#5f8a3c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9dcc2"/>
      <stop offset="1" stop-color="#d2c09c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5f42"/>
      <stop offset="1" stop-color="#5e3f2a"/>
    </linearGradient>
    <radialGradient id="steel" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#e3e8ea"/>
      <stop offset="0.6" stop-color="#9aa5a9"/>
      <stop offset="1" stop-color="#5d686c"/>
    </radialGradient>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- The hill: one long fall line from top-left to bottom-right. -->
    <path d="M0 150 C 150 170 330 300 512 420 L512 512 L0 512 Z" fill="url(#turf)"/>
    <path d="M0 214 C 150 236 320 352 512 470 L512 512 L0 512 Z" fill="url(#road)"/>
    <path d="M0 300 C 140 320 300 420 430 512 L0 512 Z" fill="url(#turf)" opacity="0.92"/>
    <path d="M40 252 C 150 270 300 366 470 482" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round" stroke-dasharray="26 30"/>
    <!-- The plinth edge. -->
    <rect y="470" width="512" height="42" fill="url(#wood)"/>
    <!-- The rider's line marker. -->
    <ellipse cx="176" cy="292" rx="40" ry="10" fill="#3d2718" opacity="0.22"/>
    <circle cx="170" cy="252" r="36" fill="url(#steel)"/>
    <circle cx="170" cy="252" r="36" fill="none" stroke="#b89458" stroke-width="7"/>
  </g>
</svg>
